<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>全站界面验证</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#18191c;font:16px/1.6 sans-serif}header{background:#fff;padding:16px;position:sticky;top:0;z-index:5}main{background:#fff;padding:24px;min-height:1600px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card,.unknown-panel{background:#fff;color:#222;border:1px solid #ddd;padding:20px;min-height:160px}.badge{display:inline-block;background:#00aeec;color:white;padding:6px 12px}.card .cover{height:80px;background:linear-gradient(120deg,#26adce,#df89ce);color:#fff}.muted{color:#999}button{padding:8px 14px;color:#222;background:#eee;border:1px solid #ccc}input{height:40px}.lower{margin-top:950px}.preview{width:480px;height:270px}.preview video{display:block;width:100%;height:100%}.qr-code{width:180px;height:180px;background:white;color:black}
</style></head><body><header class="bili-header__bar"><a href="https://www.bilibili.com/">首页</a><form id="search"><input aria-label="关键词" placeholder="搜索"><button>搜索</button></form></header><main id="app"><h1>全站界面验证</h1><div class="grid"><article class="card"><div class="cover">封面文字</div><h2>推荐内容</h2><span class="muted">发布信息</span><span class="badge">关注</span></article><section class="unknown-panel">其他页面面板<button id="counter">操作</button><output id="count">0</output></section><section class="qr-code">二维码<div><canvas width="80" height="80"></canvas></div></section></div><div id="result"></div><div id="preview-holder"></div><article class="card lower">滚动后的内容</article></main><script>
document.querySelector('#counter').onclick=()=>document.querySelector('#count').textContent=Number(document.querySelector('#count').textContent)+1;
document.querySelector('#search').onsubmit=e=>{e.preventDefault();document.querySelector('#result').innerHTML='<section class="unknown-panel">'+document.querySelector('input').value+'</section>';};
window.startPreview=async()=>{const host=document.querySelector('#preview-holder');host.className='preview';const video=document.createElement('video');video.muted=true;video.autoplay=true;video.playsInline=true;host.append(video);const source=document.createElement('canvas');source.width=320;source.height=180;const ctx=source.getContext('2d');window.previewTimer=setInterval(()=>{ctx.fillStyle=window.previewColor || '#e841b6';ctx.fillRect(0,0,320,180);},33);ctx.fillStyle='#e841b6';ctx.fillRect(0,0,320,180);video.srcObject=source.captureStream(30);await video.play();return video;};
</script></body></html>
