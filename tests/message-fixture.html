<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>消息界面验证</title><style>
:root{--bg1:#fff;--bg1_rgb:255,255,255;--bg2:#f1f2f3;--bg3:#f6f7f8;--text1:#18191c;--text2:#61666d;--text3:#9499a0;--brand_blue:#00aeec;--brand_pink:#fb7299;--text_white:#fff}
*{box-sizing:border-box}body{margin:0;font:14px/1.6 "Microsoft YaHei",sans-serif;color:var(--text1);background:#d6ebea}
header{height:64px;background:var(--bg1);padding:20px}.message-layout{display:flex;width:980px;height:calc(100vh - 64px);margin:auto}.message-aside{width:140px;flex-shrink:0;background:rgba(var(--bg1_rgb),.8);padding:24px 16px}.message-main{width:840px;background:rgba(var(--bg1_rgb),.5);padding:10px}.message-header{height:42px;background:var(--bg1);color:var(--text2);padding:10px 16px;border-radius:4px}.message-content{height:calc(100% - 52px);margin-top:10px;display:flex;gap:10px}.message-box-shadow{background:var(--bg1);border-radius:4px;box-shadow:0 2px 4px #7992b98a}.message-sidebar__item{color:var(--text2);margin-top:16px}.message-sidebar__item.is-active{color:var(--brand_blue)}.message-sidebar__item-num{background:var(--brand_pink);color:var(--text_white);border-radius:10px;padding:0 6px}.message-content__inner{padding:24px;width:100%;height:100%}.notify-item__title{color:var(--text1);font-weight:700}.notify-item__msg{color:var(--text2)}.notify-item__time{color:var(--text3);font-size:12px}.im-container{width:100%;height:calc(100% - 150px);background:var(--bg1);padding:20px}.chat-window{height:100%;background:var(--bg2);padding:20px}.msg-text{background:var(--bg1);color:var(--text1);width:fit-content;border-radius:0 16px 16px;padding:8px 16px}.msg-text-is-me{background:var(--brand_blue);color:var(--text_white);margin:20px 0 20px auto;border-radius:16px 0 16px 16px}.message-reply-box__input{background:var(--bg3);color:var(--text2);width:100%;height:65px;border:1px solid #ddd;padding:10px}
.reading-probe{position:relative;background:var(--bg1);height:150px;padding:12px;color:var(--text1)}.contrast-probe{position:absolute;right:12px;top:12px;width:32px;height:32px;background:currentColor}.contrast-probe.secondary{top:54px;color:var(--text2)}.contrast-probe.tertiary{top:96px;color:var(--text3)}.blank-probe{position:absolute;right:54px;top:12px;width:32px;height:32px}.blank-probe.secondary{top:54px}.blank-probe.tertiary{top:96px}
</style></head><body><header>哔哩哔哩 · 消息中心</header><div class="message-layout"><aside class="message-aside"><strong>消息中心</strong><div class="message-sidebar__item">回复我的</div><div class="message-sidebar__item">收到的赞</div><div class="message-sidebar__item is-active">我的消息 <span class="message-sidebar__item-num">2</span></div></aside><main class="message-main"><div class="message-header">我的消息</div><div class="message-content"><section class="message-content__inner message-box-shadow"><div class="reading-probe"><div class="notify-item__title">消息通知</div><div class="notify-item__msg">新的回复和会话会显示在这里。</div><div class="notify-item__time">今天 14:30</div><i class="contrast-probe"></i><i class="blank-probe"></i><i class="contrast-probe secondary"></i><i class="blank-probe secondary"></i><i class="contrast-probe tertiary"></i><i class="blank-probe tertiary"></i></div><div class="im-container"><div class="chat-window"><div class="msg-text">可以查看这条消息吗？</div><div class="msg-text msg-text-is-me">消息内容清晰可读。</div><textarea class="message-reply-box__input" aria-label="消息输入" placeholder="输入消息"></textarea></div></div></section></div></main></div></body></html>
